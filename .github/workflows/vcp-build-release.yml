name: VCP Build & Release

# 三端构建全部在 GitHub 托管 runner 上完成，产物统一发布到 GitHub Release。
#
#   backend  —— VCPToolBox Docker 镜像（构建并导出镜像归档）
#   mobile   —— VCPMobile Android APK（ubuntu 上交叉编译）
#   desktop  —— VCPChat Windows 客户端（windows 上原生构建）
#
# 编排原则（别退化）：
#   编译一律在云端 runner 上做完，本机只负责把成品拉下来装上。
#   本机没有编译环境，也不该有——一旦某一端依赖本机编译，
#   这台机器不开就没法出新版本了。
#   目前三端云端都能编完，所以没有任何一端走本机编译这条路。
#   万一将来某一端云端实在编不出来，才由本机 runner 编译，
#   那种情况下编完就地安装、不再走「下载 + 拉取间隔」那一套，
#   否则等于把同一个包又下了一遍。
#
# 局域网分发：workflow 结束后由 NAS 上的同步任务把 Release 产物拉到本地目录，
# 手机和 PC 从局域网地址下载更新。
#
# 所有版本号集中在 vars 里，不写死路径与地址。

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      targets:
        description: '构建目标'
        required: false
        type: choice
        default: all
        options:
          - all
          - backend
          - mobile
          - desktop
      sha:
        description: '上游提交 SHA（留空 = 最新）'
        required: false
        type: string

  # 定时检测上游更新
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: vcp-build-release
  cancel-in-progress: false

jobs:
  # ============ 0. 检测上游更新 ============
  # 三个上游各自独立判断，谁有新提交就只构建谁。
  # 判断依据：上游最新提交 SHA 与上次成功构建记录的 SHA 不同。
  # 记录存在本仓库的 state 分支上，每个上游一个文件。
  detect:
    name: 检测上游更新
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      mobile: ${{ steps.check.outputs.mobile }}
      desktop: ${{ steps.check.outputs.desktop }}
      backend_sha: ${{ steps.check.outputs.backend_sha }}
      mobile_sha: ${{ steps.check.outputs.mobile_sha }}
      desktop_sha: ${{ steps.check.outputs.desktop_sha }}
      desktop_recipe: ${{ steps.check.outputs.desktop_recipe }}
      any: ${{ steps.check.outputs.any }}
      last_release_url: ${{ steps.last.outputs.release_url }}
      backend_url: ${{ steps.last.outputs.backend_url }}
      mobile_url: ${{ steps.last.outputs.mobile_url }}
      desktop_url: ${{ steps.last.outputs.desktop_url }}
      backend_version: ${{ steps.ver.outputs.backend_version }}
      mobile_version: ${{ steps.ver.outputs.mobile_version }}
      desktop_version: ${{ steps.ver.outputs.desktop_version }}
      release_version: ${{ steps.ver.outputs.release_version }}

    steps:
      # state 分支可能还不存在，所以不用 checkout action，
      # 直接 clone 一次，失败就当作没有历史记录
      - name: 读出上次构建的提交
        id: prev
        run: |
          set -euo pipefail
          mkdir -p state
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch state "$REPO_URL" state 2>/dev/null; then
            echo "已有状态记录"
            cat state/*.sha 2>/dev/null || true
          else
            echo "首次运行，没有状态记录，将构建全部组件"
          fi

      - name: 检测各上游最新提交
        id: check
        env:
          # 手动触发时指定的目标，为空表示自动检测
          REQ_TARGETS: ${{ inputs.targets }}
          REQ_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 打包配方版本：只要改了桌面端的打包方式（补丁、版本号写入、打包参数）
          # 就把这个数加一，让下一次运行即使上游没动也重新打一次包。
          # v2: 注入数据目录补丁（安装版启动无窗口）+ 写入日期版本号
          # v4: package.json 保持三段 SemVer，Windows 文件版本另用 build.win.fileVersion 写四段
          RECIPE_VERSION=v4

          # 读取上次记录的提交，没有就当空
          prev() {
            local f="state/$1.sha"
            if [ -f "$f" ]; then tr -d '[:space:]' < "$f"; else echo ""; fi
          }

          # 查上游默认分支最新提交
          latest() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1/commits?per_page=1" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['sha'] if isinstance(d,list) and d else '')"
          }

          decide() {
            local name="$1" repo="$2"
            if [ -n "$REQ_SHA" ]; then
              echo "$REQ_SHA"
              return
            fi
            latest "$repo"
          }

          # 循环里累计，任意一个需要构建就继续
          ANY=false
          for pair in "backend:lioensky/VCPToolBox" "mobile:MRiecy/VCPMobile" "desktop:lioensky/VCPChat"; do
            name="${pair%%:*}"
            repo="${pair#*:}"

            # 手动指定单个目标时，其它目标不构建
            if [ -n "$REQ_TARGETS" ] && [ "$REQ_TARGETS" != "all" ] && [ "$REQ_TARGETS" != "$name" ]; then
              echo "$name=skip（手动指定其它目标）"
              echo "$name=false" >> "$GITHUB_OUTPUT"
              continue
            fi

            cur=$(decide "$name" "$repo")
            old=$(prev "$name")

            if [ -z "$cur" ]; then
              echo "::warning::$name 无法获取上游提交，跳过"
              echo "$name=false" >> "$GITHUB_OUTPUT"
              continue
            fi

            if [ "$cur" = "$old" ]; then
              # 上游没变，但我们的打包配方可能变了。
              # 桌面端要注入数据目录补丁、写版本号，这些一旦改动，
              # 上游虽没动也必须重打，否则发出的还是带老毛病的包。
              if [ "$name" = "desktop" ]; then
                old_recipe=$(prev "$name.recipe")
                cur_recipe="$RECIPE_VERSION"
                if [ "$old_recipe" != "$cur_recipe" ]; then
                  echo "$name=build（上游无变化，打包配方 ${old_recipe:-空} → $cur_recipe）"
                  echo "$name=true" >> "$GITHUB_OUTPUT"
                  echo "${name}_recipe=$cur_recipe" >> "$GITHUB_OUTPUT"
                  ANY=true
                  echo "${name}_sha=$cur" >> "$GITHUB_OUTPUT"
                  continue
                fi
              fi
              echo "$name=skip（无更新，仍是 ${cur:0:8}）"
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name=build（${old:0:8} → ${cur:0:8}）"
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "${name}_recipe=$RECIPE_VERSION" >> "$GITHUB_OUTPUT"
              ANY=true
            fi
            echo "${name}_sha=$cur" >> "$GITHUB_OUTPUT"
          done

          echo "any=$ANY" >> "$GITHUB_OUTPUT"
          echo "总体: any=$ANY"

      # 跳过的构建要指出「去哪下载」，但必须指向真正包含该组件成品的那一版。
      # 不能直接取 /releases/latest：那是最近一次发布，可能只构建了服务端，
      # 于是桌面端被指到一版没有桌面端产物的发布，再指一版……最后指到没有成品的那版。
      - name: 查各组件的最近一次成品
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 逐页往前翻，找到第一个带目标产物的发布就停。
          # 3 页 × 30 条足够覆盖很久了，再往前翻纯属浪费 API 配额。
          # python 必须写成单行：多行代码会从第 0 列开始，破坏 run 块缩进。
          find_release() {
            pattern="$1"
            for page in 1 2 3; do
              hit=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30&page=$page" \
                | PATTERN="$pattern" python3 -c "import sys,os,json,fnmatch; p=os.environ['PATTERN']; d=json.load(sys.stdin); d=d if isinstance(d,list) else []; ms=[r.get('tag_name','') for r in d if not r.get('draft') for a in r.get('assets',[]) if fnmatch.fnmatch(a.get('name',''), p)]; print(ms[0] if ms else '')" 2>/dev/null || echo "")
              if [ -n "$hit" ]; then
                echo "$hit"
                return
              fi
            done
            echo ""
          }

          BASE="https://github.com/${{ github.repository }}/releases"
          url_of() {
            if [ -n "$1" ]; then echo "$BASE/tag/$1"; else echo "$BASE"; fi
          }

          BE=$(find_release 'vcptoolbox-*.tar.gz')
          MB=$(find_release '*.apk')
          DE=$(find_release '*Setup*.exe')

          echo "backend_url=$(url_of "$BE")" >> "$GITHUB_OUTPUT"
          echo "mobile_url=$(url_of "$MB")" >> "$GITHUB_OUTPUT"
          echo "desktop_url=$(url_of "$DE")" >> "$GITHUB_OUTPUT"

          echo "服务端成品: ${BE:-无}"
          echo "移动端成品: ${MB:-无}"
          echo "桌面端成品: ${DE:-无}"

          # 整体兜底：三个里最新的那个，给不区分组件的场合用
          LATEST=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
          echo "release_url=$(url_of "$LATEST")" >> "$GITHUB_OUTPUT"

      - name: 检测结果
        env:
          LAST_URL: ${{ steps.last.outputs.release_url }}
        run: |
          set -euo pipefail

          # 跳过的组件不是「没东西」，而是「已经在别处发过了」，要给个跳转链接
          mark() {
            if [ "$1" = "true" ]; then
              echo "本次构建"
            else
              echo "[无更新，用最近一版](${LAST_URL})"
            fi
          }

          {
            echo "### 上游检测"
            echo ""
            echo "| 组件 | 本次动作 | 上游提交 |"
            echo "| --- | --- | --- |"
            echo "| VCPToolBox | $(mark "${{ steps.check.outputs.backend }}") | \`${{ steps.check.outputs.backend_sha }}\` |"
            echo "| VCPMobile | $(mark "${{ steps.check.outputs.mobile }}") | \`${{ steps.check.outputs.mobile_sha }}\` |"
            echo "| VCPChat | $(mark "${{ steps.check.outputs.desktop }}") | \`${{ steps.check.outputs.desktop_sha }}\` |"
            echo ""
            if [ "$LAST_URL" != "" ]; then
              echo "最近一次发布：${LAST_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 版本号跟随上游，不自造
      # 上游 VCPToolBox / VCPMobile 都用语义化 tag（v1.13.0 / v1.1.6），
      # 所以发布版本直接用上游 tag，而不是日期 + run number。
      # VCPChat 没有版本 tag，退回上游 package.json 的 version。
      - name: 读取上游版本
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 取仓库最新 tag，没有就空。
          # python 必须写成单行：多行代码会从第 0 列开始，破坏 run 块缩进。
          latest_tag() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1/tags?per_page=30" \
              | python3 -c "import sys,json,re; d=json.load(sys.stdin); vs=[(tuple(int(x) for x in m.groups()),'v%d.%d.%d'%tuple(int(x) for x in m.groups())) for t in (d if isinstance(d,list) else []) for m in [re.match(r'^[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)\$', str(t.get('name','')))] if m]; print(max(vs)[1] if vs else '')"
          }

          # 仓库没有 tag 时读 package.json 的 version
          pkg_version() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$1/contents/package.json" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); v=str(d.get('version','')).strip(); print('v'+v if v and v!='0.0.0' else '')"
          }

          # 既没 tag 又没有像样的 package.json 版本时，用提交日期当版本号。
          # 日期取的是「这次真正要构建的那个提交」的日期，不是仓库最新提交，
          # 否则手动指定 SHA 时会拿到对不上的日子。
          date_version() {
            local repo="$1" sha="$2"
            if [ -z "$sha" ]; then echo ""; return; fi
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/commits/$sha" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); c=d.get('commit',{}); dt=c.get('committer',{}).get('date') or c.get('author',{}).get('date') or ''; print('v'+dt[:10].replace('-','.') if len(dt)>=10 else '')" 2>/dev/null || echo ""
          }

          BE=$(latest_tag lioensky/VCPToolBox)
          [ -z "$BE" ] && BE=$(pkg_version lioensky/VCPToolBox)

          MB=$(latest_tag MRiecy/VCPMobile)
          [ -z "$MB" ] && MB=$(pkg_version MRiecy/VCPMobile)

          # VCPChat 没有版本 tag，package.json 恒为 1.0.0，这个数字不代表任何东西。
          # 直接按提交日期走，至少每次更新都能区分开。
          DE=$(latest_tag lioensky/VCPChat)
          [ -z "$DE" ] && DE=$(date_version lioensky/VCPChat "${{ steps.check.outputs.desktop_sha }}")
          [ -z "$DE" ] && DE=$(pkg_version lioensky/VCPChat)

          echo "backend_version=$BE" >> "$GITHUB_OUTPUT"
          echo "mobile_version=$MB" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$DE" >> "$GITHUB_OUTPUT"

          # 一版发布里可能同时更新多个组件，各自版本互不相同。
          # 只取一个组件的版本号会让另两个对不上（比如只更新了移动端，
          # 标签却是服务端的旧版本），所以把本次构建到的组件版本都带上。
          PARTS=""
          if [ "${{ steps.check.outputs.backend }}" = "true" ] && [ -n "$BE" ]; then
            PARTS="${PARTS}.${BE#v}"
          fi
          if [ "${{ steps.check.outputs.mobile }}" = "true" ] && [ -n "$MB" ]; then
            PARTS="${PARTS}.${MB#v}"
          fi
          if [ "${{ steps.check.outputs.desktop }}" = "true" ] && [ -n "$DE" ]; then
            PARTS="${PARTS}.${DE#v}"
          fi

          # 全部跳过时（理论上不会走到发布）退回服务端版本
          if [ -z "$PARTS" ]; then
            RV="${BE#v}"
            [ -z "$RV" ] && RV="${MB#v}"
            [ -z "$RV" ] && RV="${DE#v}"
            echo "release_version=${RV}" >> "$GITHUB_OUTPUT"
          else
            echo "release_version=${PARTS#.}" >> "$GITHUB_OUTPUT"
          fi

          echo "服务端版本: ${BE:-未知}"
          echo "移动端版本: ${MB:-未知}"
          echo "桌面端版本: ${DE:-未知}"
          echo "发布版本: ${PARTS#.}"

  # ============ 1. 服务端 ============
  backend:
    name: 构建 VCPToolBox
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.detect.outputs.backend == 'true'

    steps:
      # 先检出本仓库，拿到构建脚本
      - name: 检出构建脚本
        uses: actions/checkout@v4
        with:
          path: ci

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: lioensky/VCPToolBox
          ref: ${{ inputs.sha || 'main' }}
          path: src
          fetch-depth: 1

      - name: 记录版本
        id: meta
        run: |
          SHA=$(git -C src rev-parse HEAD)
          SHORT=${SHA:0:8}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          # 上游语义化版本，由 detect 统一查好传下来，产物名和 Release 都对齐它
          VER="${{ needs.detect.outputs.backend_version }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "上游版本: ${VER:-未知}"
          echo "服务端提交: $SHA"

      - name: 准备构建上下文
        run: |
          # 上游 Dockerfile 的 COPY 漏了运行所需目录，补上
          cd src
          for d in TVStxt ToolConfigs config; do
            if [ -d "$d" ]; then
              echo "存在: $d"
            else
              echo "补空目录: $d"
              mkdir -p "$d"
              touch "$d/.keep"
            fi
          done

          # 上游 Dockerfile 只编译了 rust-vexus-lite，插件里的 Rust 子项目靠仓库里
          # 的预编译二进制，缺 x86_64-linux 版本的插件跑不起来。补上编译段。
          python3 ../ci/scripts/patch-dockerfile.py Dockerfile

      - name: 构建镜像
        id: build
        run: |
          cd src
          # 构建失败要看到真正的错误，别被 tail 截掉尾部之外的信息
          if ! docker build -t "vcptoolbox:build" . ; then
            echo "::error::镜像构建失败"
            exit 1
          fi
          # 三个标签：
          #   <短hash>   精确对应一次上游提交，回滚用
          #   v<版本>    对应上游版本号，跟 Release 标签对得上
          #   latest     日常拉取
          SHORT="${{ steps.meta.outputs.short }}"
          VER="${{ steps.meta.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/vcptoolbox"
          docker tag "vcptoolbox:build" "$IMAGE:$SHORT"
          if [ -n "$VER" ]; then
            docker tag "vcptoolbox:build" "$IMAGE:$VER"
            echo "ver_tag=$VER" >> "$GITHUB_OUTPUT"
          else
            # 取不到上游版本时不给假标签，宁可少一个
            echo "::warning::没有上游版本号，跳过版本标签"
            echo "ver_tag=" >> "$GITHUB_OUTPUT"
          fi
          docker tag "vcptoolbox:build" "$IMAGE:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: 推送镜像到 Docker Hub
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DH_TOKEN" ]; then
            echo "未配置 Docker Hub 凭证，跳过推送"
            exit 0
          fi
          IMAGE="${{ steps.build.outputs.image }}"
          SHORT="${{ steps.meta.outputs.short }}"
          VER_TAG="${{ steps.build.outputs.ver_tag }}"
          echo "登录 Docker Hub"
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          PUSHED=":$SHORT"
          docker push "$IMAGE:$SHORT"
          if [ -n "$VER_TAG" ]; then
            docker push "$IMAGE:$VER_TAG"
            PUSHED="$PUSHED / :$VER_TAG"
          fi
          docker push "$IMAGE:latest"
          echo "已推送 $IMAGE$PUSHED / :latest"

      - name: 清理旧镜像（只留最新 10 个）
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP_SHA: ${{ steps.meta.outputs.short }}
          KEEP_VER: ${{ steps.build.outputs.ver_tag }}
        run: |
          if [ -z "$DH_TOKEN" ]; then
            echo "未配置凭证，跳过清理"
            exit 0
          fi
          python3 ci/scripts/prune-dockerhub.py

      - name: 更新 Docker Hub 仓库说明
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.sha }}
          UPSTREAM_VERSION: ${{ needs.detect.outputs.backend_version }}
          # release job 依赖本 job，这里取不到它的输出，用完整 SHA 拼发布页地址
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DH_TOKEN" ]; then
            echo "未配置凭证，跳过"
            exit 0
          fi
          python3 ci/scripts/update-dockerhub-desc.py

      - name: 导出 Linux 二进制
        id: bin
        run: |
          set -euo pipefail

          SHORT="${{ steps.meta.outputs.short }}"
          SHA="${{ steps.meta.outputs.sha }}"
          DATE=$(date -u '+%Y%m%d')
          # 版本号在前、commit 在后：同名版本的不同构建靠 hash 区分，
          # 跟 GitHub 上常见的 <name>-<version>-<platform>.<ext> 一致
          VER="${{ steps.meta.outputs.version }}"
          VER=${VER#v}
          if [ -n "$VER" ]; then
            NAME="vcptoolbox-${VER}-${SHORT}-linux-amd64"
          else
            NAME="vcptoolbox-${DATE}-${SHORT}-linux-amd64"
          fi
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/vcptoolbox:${SHORT}"
          mkdir -p pkg

          # 从构建好的镜像里取出应用目录，而不是发布整包镜像。
          # 用 docker cp 而不是 docker export + tar 过滤：后者对 ./ 前缀和
          # 隐藏文件的匹配行为不可靠，实测会取不到东西。
          CID=$(docker create "vcptoolbox:build")
          if ! docker cp "$CID:/usr/src/app" pkg/app; then
            docker rm -f "$CID" >/dev/null 2>&1 || true
            echo "::error::未能从镜像中取出 /usr/src/app"
            exit 1
          fi
          docker rm -f "$CID" >/dev/null 2>&1 || true

          if [ ! -f "pkg/app/main.js" ] && [ ! -f "pkg/app/server.js" ]; then
            echo "::error::取出的目录不完整，缺少入口文件"
            ls -la pkg/app | head -20
            exit 1
          fi
          echo "应用目录体积: $(du -sh pkg/app | cut -f1)"

          # 构建信息，跟二进制放在一起
          NODE_V=$(docker run --rm --entrypoint node "vcptoolbox:build" -v 2>/dev/null | head -1)
          {
            echo "VCPToolBox ${NAME}"
            echo "============================================"
            echo ""
            echo "项目       VCPToolBox"
            echo "提交       ${SHA}"
            echo "短提交     ${SHORT}"
            echo "构建时间   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "构建环境   GitHub Actions / ubuntu-latest"
            echo "运行时     ${NODE_V:-node 20} on Alpine Linux (musl)"
            echo ""
            echo "安装"
            echo "------------"
            echo "解压后得到 app/ 目录，即应用根目录："
            echo ""
            echo "  tar -xzf ${NAME}.tar.gz"
            echo "  cd app"
            echo "  node main.js"
            echo ""
            echo "依赖已内置（node_modules、pydeps、编好的原生模块），无需 npm install。"
            echo ""
            echo "注意"
            echo "------------"
            echo "本包为 Alpine(musl) 构建，需要 glibc 的系统请改用 Docker 镜像："
            echo "  docker pull ${IMAGE_TAG}"
          } > pkg/app/BUILD-INFO.txt

          tar -czf "${NAME}.tar.gz" -C pkg app
          ls -lh "${NAME}.tar.gz"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "${NAME}.tar.gz")" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: "*.tar.gz"
          retention-days: 7
          compression-level: 0

      - name: 汇总
        run: |
          {
            echo "### 服务端"
            echo ""
            echo "- 提交: \`${{ steps.meta.outputs.sha }}\`"
            echo "- Linux 二进制: \`${{ steps.bin.outputs.name }}.tar.gz\`"
            echo "- Docker Hub: \`${{ steps.build.outputs.image }}:${{ steps.meta.outputs.short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============ 2. 移动端 APK ============
  mobile:
    name: 构建 VCPMobile APK
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.detect.outputs.mobile == 'true'

    steps:
      # 先检出本仓库，拿到构建脚本
      - name: 检出构建脚本
        uses: actions/checkout@v4
        with:
          path: ci

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: MRiecy/VCPMobile
          ref: ${{ needs.detect.outputs.mobile_sha || inputs.sha || 'main' }}
          path: src
          fetch-depth: 1

      - name: 记录版本
        id: meta
        run: |
          SHA=$(git -C src rev-parse HEAD)
          SHORT=${SHA:0:8}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "移动端提交: $SHA"

      # 工具链版本由上游 .github/toolchain.env 提供，单一下游不重复维护
      - name: 载入工具链版本
        run: |
          if [ -f src/.github/toolchain.env ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' src/.github/toolchain.env >> "$GITHUB_ENV"
          fi
          # 兜底默认值（上游文件缺失时）
          : "${NODE_VERSION:=24.14.1}" && echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          : "${PNPM_VERSION:=12.6.0}" && echo "PNPM_VERSION=$PNPM_VERSION" >> "$GITHUB_ENV"
          : "${JAVA_VERSION:=17}" && echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"
          : "${ANDROID_COMPILE_SDK_VERSION:=36}" && echo "ANDROID_COMPILE_SDK_VERSION=$ANDROID_COMPILE_SDK_VERSION" >> "$GITHUB_ENV"
          : "${ANDROID_BUILD_TOOLS_VERSION:=36.0.0}" && echo "ANDROID_BUILD_TOOLS_VERSION=$ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          : "${NDK_VERSION:=29.0.14206865}" && echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/src-tauri/gen/android/**/*.gradle*', 'src/src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keys
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用仓库配置的签名密钥"
            printf '%s' "$KEYSTORE_B64" | base64 -d > keys/release.jks
            test -s keys/release.jks || { echo "::error::密钥解码失败"; exit 1; }
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keys/release.jks" >> "$GITHUB_ENV"
            echo "已写入密钥: $(stat -c %s keys/release.jks) 字节"
          else
            echo "::warning::未配置签名密钥，产出未签名 APK，无法覆盖安装旧版本"
          fi

      - name: 构建 APK
        env:
          VCP_SERVER_URL: ${{ vars.VCP_SERVER_URL }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$VCP_SERVER_URL" ]; then
            echo "::error::未配置仓库变量 VCP_SERVER_URL"
            exit 1
          fi
          mkdir -p work
          WORK="$GITHUB_WORKSPACE/work" \
          BUILD_MODE=host \
          SRC_DIR="$GITHUB_WORKSPACE/src" \
          VCP_SERVER_URL="$VCP_SERVER_URL" \
          KEY_ALIAS="$ANDROID_KEY_ALIAS" \
          KEY_PASS="$ANDROID_KEYSTORE_PASSWORD" \
          KEYSTORE_PATH="${KEYSTORE_PATH:-}" \
          DOWNLOAD_URL="${{ vars.VCP_APK_URL }}" \
            bash ci/vcpmobile/build-apk.sh

      - name: 校验产物
        run: |
          APK="work/out/VCPMobile-latest.apk"
          test -f "$APK" || { echo "::error::未产出 APK"; exit 1; }
          ls -lh "$APK"
          # 有签名就验证，没签名只提示
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          if [ -f "$KEYSTORE_PATH" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -5
          else
            echo "未签名，跳过签名校验"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          # 通配符收全部 apk：固定名 + 带版本号的命名副本
          path: |
            work/out/*.apk
            work/out/manifest.json
            work/out/index.html
          retention-days: 7
          compression-level: 0

      - name: 汇总
        run: |
          {
            echo "### 移动端 APK"
            echo ""
            echo '```json'
            cat work/out/manifest.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============ 3. 桌面端 ============
  desktop:
    name: 构建 VCPChat 客户端
    needs: detect
    runs-on: windows-latest
    timeout-minutes: 120
    if: needs.detect.outputs.desktop == 'true'

    steps:
      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: lioensky/VCPChat
          ref: ${{ needs.detect.outputs.desktop_sha || inputs.sha || 'main' }}
          path: src
          fetch-depth: 1

      - name: 记录版本
        id: meta
        shell: pwsh
        run: |
          $sha = (git -C src rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
          Write-Host "桌面端提交: $sha"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/rust_chat_data_service -> target
            src/rust_voice_input_engine -> target
            src/rust_projectforge_indexer -> target

      - name: 升级 node-gyp
        shell: pwsh
        run: |
          # 托管 windows 镜像已切换到 Visual Studio 2026，
          # 依赖自带的 node-gyp 太旧，识别不出新版本号，会直接放弃。
          # 升级后通过环境变量让 npm 优先使用这个全局版本。
          npm install -g node-gyp@latest
          $gypRoot = (npm root -g).Trim()
          "npm_config_node_gyp=$gypRoot\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV
          node-gyp --version

      - name: 下载依赖（不编译）
        shell: pwsh
        working-directory: src
        run: |
          # 只下载源码，跳过全部安装脚本。
          # 原生模块统一在修正 gyp 配置后编译，避免中途失败中断流程。
          npm install --omit=optional --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "依赖下载失败" }
          Write-Host "依赖下载完成"

      - name: 修正原生模块编译环境
        shell: pwsh
        working-directory: src
        run: |
          # node-pty 强制要求 Spectre 缓解库，托管环境不一定装了该组件，
          # 直接在 gyp 里关掉，避免 MSB8040
          $gypFiles = @(
            "node_modules/node-pty/binding.gyp",
            "node_modules/node-pty/deps/winpty/src/winpty.gyp"
          )
          foreach ($p in $gypFiles) {
            if (-not (Test-Path $p)) { continue }
            $t = Get-Content $p -Raw
            if ($t -match "'SpectreMitigation':\s*'Spectre'") {
              $t = $t -replace "'SpectreMitigation':\s*'Spectre'", "'SpectreMitigation': 'false'"
              [System.IO.File]::WriteAllText((Resolve-Path $p), $t, (New-Object System.Text.UTF8Encoding($false)))
              Write-Host "已关闭 Spectre 检查: $(Split-Path $p -Leaf)"
            }
          }

          # 打包阶段的 runtime closure 校验要求 sharp 的平台二进制存在
          if (Test-Path "node_modules/sharp") {
            if (-not (Test-Path "node_modules/@img/sharp-win32-x64")) {
              Write-Host "补装 sharp 的 win32-x64 二进制"
              npm install --no-save @img/sharp-win32-x64
            }
          }

      - name: 重新编译原生模块
        shell: pwsh
        working-directory: src
        run: |
          # 补丁和 node-gyp 升级都就位了，重跑一次让原生模块真正编译出来
          npx @electron/rebuild -f -w better-sqlite3 -w node-pty -w hnswlib-node
          if ($LASTEXITCODE -ne 0) { throw "原生模块重编译失败" }

      - name: 构建并打包
        shell: pwsh
        working-directory: src
        env:
          # 打包完只产出安装包，发布交给后面的 Release 步骤
          EP_DISABLE_PUBLISH: "true"
          APP_VERSION: ${{ needs.detect.outputs.desktop_version }}
        run: |
          # 上游 package.json 的 version 恒为 1.0.0，从不更新。
          # 不改的话装完在「程序和功能」里永远显示 1.0.0，
          # 看不出装的是哪一版，也没法判断更新有没有生效。
          $ver = $env:APP_VERSION
          if ($ver) {
            $ver = $ver.TrimStart("v")
            # electron-builder 用 SemVer 校验 package.json 的 version，
            # 只认「主.次.修订」三段，多写一段直接报 Invalid version。
            # 日期 2026.10.26 本身就是合法的三段，原样写进去即可。
            #
            # Windows 版本资源是四个独立 16 位整数，electron-builder 从 SemVer
            # 推 FileVersion 时会把 26 当成末段丢掉，实测显示成 2026.10.2-6.0。
            # 所以额外在 build.win.fileVersion 里写死四段，让资源里是 2026.10.26.0。
            $fileVer = $ver
            if ($ver -match '^(\d+)\.(\d+)\.(\d+)$') { $fileVer = "$ver.0" }

            $pkgPath = Join-Path (Get-Location) "package.json"
            $raw = Get-Content $pkgPath -Raw -Encoding utf8
            # 只替换顶层 version，不用 ConvertTo-Json 整写，
            # 否则上游字段顺序和格式全被打乱
            $new = [regex]::Replace($raw, '("version"\s*:\s*")[^"]*(")', "`${1}$ver`${2}", 1)
            if ($new -eq $raw) { throw "package.json 里没有 version 字段" }

            # 在 build.win 里补 fileVersion，只影响 Windows 版本资源，
            # 安装包文件名和升级判断仍然走 SemVer。
            if ($new -match '"win"\s*:\s*\{') {
              $new = [regex]::Replace($new, '("win"\s*:\s*\{)', "`${1}`r`n      `"fileVersion`": `"$fileVer`",", 1)
            }
            [System.IO.File]::WriteAllText($pkgPath, $new, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "版本号写入 $ver（Windows 文件版本 $fileVer）"
          }

          # ---- 修安装版的数据目录 ----
          # 上游 main.js 里 PROJECT_ROOT = __dirname，数据目录取 __dirname\AppData。
          # 源码直接跑时这是项目目录，可写；但打包后 __dirname 指向 app.asar 内部，
          # asar 是只读归档，启动时 fs.ensureDirSync 直接抛错，
          # 窗口永远等不到 did-finish-load，现象是进程起一堆、界面死活不出现。
          #
          # 官方自己的处理方式（apps/bootstrap-installer/src-tauri/src/lib.rs 第 950 行）
          # 给启动器注入 VCPCHAT_APP_DATA_DIR = <项目根>\AppData，
          # 并且明确说明这是为了避免多份 Electron 共用默认 userData 产生单实例冲突
          # （docs/vcpchat-tauri-installer-development-plan.md 第 229 行）。
          # 所以这里跟着官方走：数据放「程序目录\AppData」，不要改成 userData。
          #
          # 装到哪儿由部署脚本的 /D 决定，这里只保证「数据永远跟着程序走」。
          # 实测 process.execPath 就是安装目录里的主程序路径，dirname 即安装目录。
          $mainJs = Join-Path (Get-Location) "main.js"
          if (Test-Path $mainJs) {
            $mj = Get-Content $mainJs -Raw -Encoding utf8
            if ($mj.Contains("const APP_DATA_ROOT_IN_PROJECT = isolatedAppDataRoot")) {
              $mj = [regex]::Replace(
                $mj,
                "const APP_DATA_ROOT_IN_PROJECT = isolatedAppDataRoot\r?\n\s*\? path\.resolve\(isolatedAppDataRoot\)\r?\n\s*: path\.join\(PROJECT_ROOT, 'AppData'\);",
                "const APP_DATA_ROOT_IN_PROJECT = isolatedAppDataRoot`r`n    ? path.resolve(isolatedAppDataRoot)`r`n    : path.join(app.isPackaged ? path.dirname(app.getPath('exe')) : PROJECT_ROOT, 'AppData');"
              )
              [System.IO.File]::WriteAllText($mainJs, $mj, (New-Object System.Text.UTF8Encoding($false)))
              Write-Host "已修安装版数据目录: 打包后用程序目录\AppData"
            }
            else {
              # 打不上就别发了 —— 带这个病的安装包装出来是打不开的，
              # 与其发个能装不能跑的包，不如在构建阶段就失败
              throw "main.js 里没找到 APP_DATA_ROOT_IN_PROJECT 定义，安装版会打不开"
            }
          }
          else {
            throw "src/main.js 不存在，打包目录不对"
          }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }

          # --publish never 阻止 electron-builder 自己往 GitHub 发 Release
          # （它默认会尝试，缺 token 时在打包完成后报错退出）
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "打包失败" }

      - name: 收集产物
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          $short = "${{ steps.meta.outputs.short }}"

          # 版本号取 detect 算好的那个（上游 tag 优先，没有就用提交日期）。
          # 不要再读 src/package.json：VCPChat 那里写死 1.0.0，跟实际更新无关。
          $ver = "${{ needs.detect.outputs.desktop_version }}".TrimStart('v')
          if (-not $ver) { $ver = $short }

          # 收集全部二进制成品：安装包、增量更新块、绿色版压缩包
          $exts = @('.exe', '.msi', '.msix', '.appx', '.7z', '.zip', '.blockmap', '.yml')
          $files = Get-ChildItem src/dist -File |
            Where-Object { $exts -contains $_.Extension.ToLower() }

          if (-not $files) { throw "未找到安装包产物" }

          foreach ($f in $files) {
            $name = $f.Name
            $ext = $f.Extension.ToLower()

            if ($ext -eq '.exe' -and $name -notmatch 'uninstall') {
              # 安装包：VCPChat-Setup-<版本>-<短hash>.exe
              $name = "VCPChat-Setup-$ver-$short.exe"
            } elseif ($ext -eq '.blockmap') {
              # 增量更新块必须和安装包同名，跟着改
              $name = "VCPChat-Setup-$ver-$short.exe.blockmap"
            } elseif ($ext -eq '.yml') {
              # 更新描述文件，同样跟着安装包名
              $name = "VCPChat-Setup-$ver-$short.yml"
            } else {
              $base = [IO.Path]::GetFileNameWithoutExtension($f.Name)
              $name = "$base-$ver-$short$ext"
            }

            Copy-Item $f.FullName "out/$name"
            Write-Host "$name $([math]::Round($f.Length/1MB,2)) MB"
          }

          # 免安装版：VCPChat-Portable-<版本>-<短hash>.zip
          $unpacked = "src/dist/win-unpacked"
          if (Test-Path $unpacked) {
            $zipName = "VCPChat-Portable-$ver-$short.zip"
            Write-Host "打包免安装版"
            Compress-Archive -Path "$unpacked/*" -DestinationPath "out/$zipName" -CompressionLevel Optimal
            Write-Host "$zipName $([math]::Round((Get-Item "out/$zipName").Length/1MB,1)) MB"
          }

          # 记录版本供发布说明使用
          "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: out/*
          retention-days: 7
          compression-level: 0

      - name: 汇总
        shell: pwsh
        run: |
          "### 桌面端" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem out -File | ForEach-Object {
            "- $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" >> $env:GITHUB_STEP_SUMMARY
          }

  # ============ 4. 发布 Release ============
  release:
    name: 发布 Release
    needs: [detect, backend, mobile, desktop]
    # 有组件构建成功才发布；全部跳过时既不建 Release，也不该报失败
    if: |
      always()
      && !cancelled()
      && (needs.backend.result == 'success' || needs.mobile.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      backend_changed: ${{ needs.detect.outputs.backend }}
      desktop_changed: ${{ needs.detect.outputs.desktop }}
      mobile_changed: ${{ needs.detect.outputs.mobile }}

    steps:
      - name: 生成版本标签
        id: tag
        env:
          VERSION: ${{ needs.detect.outputs.release_version }}
        run: |
          # 标签直接沿用上游版本（如 v1.13.0），跟上游 tag 对得上，用户一眼能看出
          # 这版对应上游哪个版本。同一上游版本重复构建时追加 .N 递增，保证不冲突。
          BASE="v${VERSION}"
          if [ -z "$VERSION" ]; then
            # 上游一个版本号都取不到时才退回日期，正常不该走到这
            BASE="v$(date -u '+%Y.%m.%d')"
            echo "::warning::上游没有可用版本号，改用日期 $BASE"
          fi

          TAG="$BASE"
          n=1
          # 已存在同名 tag 就追加 .N 递增。用 API 查，这个 job 没有 checkout，
          # 依赖本地 git 会失败。
          tag_exists() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$1" | grep -q '^200$'
          }
          while tag_exists "$TAG"; do
            n=$((n + 1))
            TAG="${BASE}.${n}"
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次标签: $TAG"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p release

          # 只收可以直接下载使用的二进制成品。
          # .json/.html 是分发站用的元数据和下载页，不属于成品，不放进来。
          for d in artifacts/*/; do
            name=$(basename "$d")
            find "$d" -type f \
              \( -name '*.apk' -o -name '*.exe' -o -name '*.msi' -o -name '*.msix' \
                 -o -name '*.appx' -o -name '*.7z' -o -name '*.zip' \
                 -o -name '*.blockmap' -o -name '*.tar.gz' \) | while read -r f; do
              base=$(basename "$f")
              dest="release/$base"
              # 同名文件加来源前缀，避免互相覆盖
              if [ -f "$dest" ]; then
                dest="release/${name}-${base}"
              fi
              cp "$f" "$dest"
            done
          done

          COUNT=$(find release -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有收集到任何二进制成品"
            exit 1
          fi

          echo "=== 收集到的成品"
          find release -type f -printf '%10s  %p\n' | sort -k2

      - name: 生成校验值
        run: |
          set -euo pipefail
          cd release
          # 每个成品一个 SHA256.txt，便于单独校验，也是常见分发习惯
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256|*.txt) continue ;;
            esac
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: 生成汇总清单
        run: |
          set -euo pipefail
          cd release
          # 汇总清单：文件名保持通用惯例
          find . -maxdepth 1 -type f -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 -r cat > SHA256SUMS
          echo "=== SHA256SUMS"
          cat SHA256SUMS

      - name: 生成发布说明
        run: |
          set -euo pipefail

          # 状态要能直接看出成功还是失败。跳过时要指向真正包含该组件成品的发布，
          # 所以链接是按组件分别传进来的，不能统一用一个地址。
          state() {
            case "$1" in
              success) echo "✅ 构建成功" ;;
              skipped) echo "[⏭️ 无变更]($2)" ;;
              failure) echo "❌ 构建失败" ;;
              cancelled) echo "⚠️ 已取消" ;;
              *) echo "⚠️ $1" ;;
            esac
          }
          BE_URL="${{ needs.detect.outputs.backend_url }}"
          MB_URL="${{ needs.detect.outputs.mobile_url }}"
          DE_URL="${{ needs.detect.outputs.desktop_url }}"

          {
            echo "## VCP 自动构建"
            echo ""
            echo "构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| 组件 | 版本 | 结果 | 上游提交 |"
            echo "| --- | --- | --- | --- |"
            echo "| 服务端 VCPToolBox | \`${{ needs.detect.outputs.backend_version }}\` | $(state "${{ needs.backend.result }}" "$BE_URL") | \`${{ needs.detect.outputs.backend_sha }}\` |"
            echo "| 移动端 VCPMobile | \`${{ needs.detect.outputs.mobile_version }}\` | $(state "${{ needs.mobile.result }}" "$MB_URL") | \`${{ needs.detect.outputs.mobile_sha }}\` |"
            echo "| 桌面端 VCPChat | \`${{ needs.detect.outputs.desktop_version }}\` | $(state "${{ needs.desktop.result }}" "$DE_URL") | \`${{ needs.detect.outputs.desktop_sha }}\` |"
            echo ""
            echo "版本号取自上游仓库的最新 tag，与实际构建的代码一致。"
            echo ""
            echo "「无变更」表示上游这轮没有新提交，不代表出错。点进去是该组件最近一次真正构建出来的成品。"
            echo ""

            # 有失败时明确写出来，别让用户以为是正常发布
            if [ "${{ needs.backend.result }}" = "failure" ] \
               || [ "${{ needs.mobile.result }}" = "failure" ] \
               || [ "${{ needs.desktop.result }}" = "failure" ]; then
              echo "> ⚠️ **本次有组件构建失败**，失败的组件没有新产物，请到 [构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 查看原因。"
              echo ""
            fi

            if ls release/*.apk >/dev/null 2>&1; then
              echo "### Android"
              echo ""
              for f in release/*.apk; do
                echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              done
              echo ""
            fi

            if ls release/*.exe >/dev/null 2>&1 || ls release/*.zip >/dev/null 2>&1; then
              echo "### Windows"
              echo ""
              for f in release/*.exe release/*.zip; do
                [ -f "$f" ] || continue
                echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              done
              echo ""
            fi

            if ls release/*.tar.gz >/dev/null 2>&1; then
              echo "### Linux"
              echo ""
              for f in release/*.tar.gz; do
                echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              done
              echo ""
              echo '```bash'
              echo 'tar -xzf vcptoolbox-*.tar.gz'
              echo 'cd app && node main.js'
              echo '```'
              echo ""
              echo "包内附 \`BUILD-INFO.txt\`，写明提交、构建时间和运行环境。"
              echo ""
              echo "也可以直接用容器镜像：\`docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vcptoolbox:latest\`"
              echo ""
            fi

            if [ -s release/SHA256SUMS ]; then
              echo "### 校验"
              echo ""
              echo '```bash'
              echo 'sha256sum -c SHA256SUMS'
              echo '```'
              echo ""
              echo "每个成品也都单独附了 \`.sha256\` 文件。"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: 汇总
        run: |
          {
            echo "### 发布"
            echo ""
            echo "已发布 [${{ steps.tag.outputs.tag }}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.tag.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # 记录本次构建成功对应的上游提交，下次比对用
      - name: 保存构建状态
        if: success()
        run: |
          set -euo pipefail

          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 先明确探测远端有没有 state 分支，不要把「clone 失败」和「分支不存在」混为一谈
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "已有状态分支，基于它更新"
            git fetch -q --depth 1 origin state
            git checkout -q -B state FETCH_HEAD
          else
            echo "首次创建状态分支"
            git checkout -q --orphan state
          fi

          # 只记录本次真正构建成功的组件
          [ "${{ needs.backend.result }}" = "success" ] && echo "${{ needs.detect.outputs.backend_sha }}" > backend.sha || true
          [ "${{ needs.mobile.result }}" = "success" ] && echo "${{ needs.detect.outputs.mobile_sha }}" > mobile.sha || true
          [ "${{ needs.desktop.result }}" = "success" ] && echo "${{ needs.detect.outputs.desktop_sha }}" > desktop.sha || true
          # 记下这次用的打包配方，下次据此判断「上游没动但打包方式变了」要不要重打
          [ "${{ needs.desktop.result }}" = "success" ] && echo "${{ needs.detect.outputs.desktop_recipe }}" > desktop.recipe || true

          echo "${{ steps.tag.outputs.tag }}" > last-release.txt
          date -u '+%Y-%m-%d %H:%M UTC' > last-built.txt

          git add -A
          if git diff --cached --quiet && git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "状态无变化"
          else
            git commit -q -m "state: ${{ steps.tag.outputs.tag }}"
            git push origin state
            echo "状态已更新"
          fi

  # ============ 5. 运行摘要 ============
  # 保证无论本次是「全跳过」还是「有产出」，运行结束后都有一份带链接的说明
  # ============ 4. 自动部署 ============
  # 构建完成后立即把新版本推到在跑的 runner 上。
  # 两条触发路径：
  #   1. 本次有新构建 → 立刻部署（下面的 job）
  #   2. runner 上线后发现落后 → 由 deploy-sync.yml 定时对齐
  # 两条都调同一批脚本，行为一致。
  deploy-server:
    name: 部署服务端
    needs: [detect, release]
    # 只有服务端真的重建了才推，没变就不重启线上服务
    if: |
      always()
      && !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.backend_changed == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          path: ci

      - name: 更新服务
        shell: bash
        env:
          DEPLOY_DIR: ${{ vars.VCP_SERVER_DIR }}
          # 镜像 tag 用短 hash：推送时打的是 8 位，这里传完整 SHA 会拉不到。
          FULL_SHA: ${{ needs.detect.outputs.backend_sha }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TARGET_SHA: ${{ needs.detect.outputs.backend_sha }}
          HEALTH_URL: ${{ vars.VCP_SERVER_URL }}
          TARGET_TAG: ${{ needs.release.outputs.tag }}
          INTERVAL_H: ${{ vars.VCP_SERVER_INTERVAL_H || '168' }}
          # 手动触发意味着「我就是要现在换上」；定时触发才按间隔算。
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x ci/deploy/update-server.sh
          # 镜像只按短 hash 打标，拉取必须用同一个名字
          export TARGET_IMAGE="${DH_USER}/vcptoolbox:${FULL_SHA:0:8}"
          echo "目标镜像: $TARGET_IMAGE"
          bash ci/deploy/update-server.sh

  deploy-chat:
    name: 部署桌面端
    needs: [detect, release]
    if: |
      always()
      && !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.desktop_changed == 'true'
    runs-on: [self-hosted, windows, local]
    timeout-minutes: 20

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          path: ci

      - name: 检查脚本编码
        # PowerShell 5.1 按系统代码页（简体中文是 GBK）读脚本文件，
        # 没有 BOM 的 UTF-8 会被读成乱码，连引号都会错位。
        shell: powershell
        run: |
          $f = ".\ci\deploy\update-chat.ps1"
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
            Write-Host "ERROR: $f must be UTF-8 with BOM"
            exit 1
          }
          Write-Host "encoding ok"

      - name: 更新客户端
        # 服务账户（NETWORK SERVICE）的 PATH 里没有 pwsh，只能用系统自带的 5.1。
        # 注意：5.1 按系统代码页读脚本，这个 run 块里只能写英文 —— 中文会乱码
        # 并破坏引号配对，报 TerminatorExpectedAtEndOfString。
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAT_DIR: ${{ vars.VCP_CHAT_DIR }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
          INTERVAL_H: ${{ vars.VCP_CHAT_INTERVAL_H || '168' }}
          # 手动触发意味着「我就是要现在装上」，不能又被间隔拦回去。
          # 定时触发才按间隔算，避免隔三差五重启客户端。
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if (-not $env:CHAT_DIR) {
            Write-Host "VCP_CHAT_DIR not set, skip"
            exit 0
          }
          if (-not $env:TAG) {
            Write-Host "no release tag, skip"
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          try {
            $hours = 168
            if ($env:INTERVAL_H) { [int]::TryParse($env:INTERVAL_H, [ref]$hours) | Out-Null }
            $force = ($env:FORCE -eq '1')
            & .\ci\deploy\update-chat.ps1 -Tag $env:TAG -DeployDir $env:CHAT_DIR -Repo $env:REPO -IntervalHours $hours -Force:$force
            if (-not $?) { exit 1 }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            exit 0
          }
          catch {
            Write-Host "ERR: $_"
            exit 1
          }

  summary:
    name: 构建摘要
    needs: [detect, backend, mobile, desktop, release]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 写运行摘要
        env:
          NEW_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          BE_URL="${{ needs.detect.outputs.backend_url }}"
          MB_URL="${{ needs.detect.outputs.mobile_url }}"
          DE_URL="${{ needs.detect.outputs.desktop_url }}"

          # 跳过的组件要去它自己最近一次真正构建出来的那一版，逐个指路
          mark() {
            case "$1" in
              success) echo "✅ 本次构建" ;;
              skipped) echo "⏭️ [无变更]($2)" ;;
              failure) echo "❌ 失败" ;;
              *) echo "$1" ;;
            esac
          }

          {
            echo "## VCP 构建结果"
            echo ""
            echo "| 组件 | 版本 | 结果 | 上游提交 |"
            echo "| --- | --- | --- | --- |"
            echo "| 服务端 VCPToolBox | \`${{ needs.detect.outputs.backend_version }}\` | $(mark "${{ needs.backend.result }}" "$BE_URL") | \`${{ needs.detect.outputs.backend_sha }}\` |"
            echo "| 移动端 VCPMobile | \`${{ needs.detect.outputs.mobile_version }}\` | $(mark "${{ needs.mobile.result }}" "$MB_URL") | \`${{ needs.detect.outputs.mobile_sha }}\` |"
            echo "| 桌面端 VCPChat | \`${{ needs.detect.outputs.desktop_version }}\` | $(mark "${{ needs.desktop.result }}" "$DE_URL") | \`${{ needs.detect.outputs.desktop_sha }}\` |"
            echo ""
            if [ -n "${NEW_TAG:-}" ]; then
              echo "本次发布：[$NEW_TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$NEW_TAG)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"