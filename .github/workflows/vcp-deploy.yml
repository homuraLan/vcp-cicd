name: VCP Build & Deploy

# 三条流水线，全部由 self-hosted runner 执行，仅出站连接，无需入站端口。
#
#   backend  —— VCPToolBox 服务端镜像构建与部署
#   mobile   —— VCPMobile Android APK 交叉编译
#   desktop  —— VCPChat Windows 客户端构建
#
# 本机路径、内网地址等环境相关配置全部通过仓库变量注入，不写死在此文件中：
#   VCP_CI_DIR       服务端 CI 工作目录
#   VCP_MOBILE_DIR   移动端工作目录
#   VCP_CHAT_DIR     桌面端工作目录
#   VCP_CHAT_SCRIPT  桌面端构建脚本
#   VCP_APK_URL      移动端分发地址

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      sha:
        description: '提交 SHA（留空 = 上游 main 最新）'
        required: false
        type: string
      force:
        description: '强制重建（忽略版本比对）'
        required: false
        type: boolean
        default: false
      targets:
        description: '构建目标'
        required: false
        type: choice
        default: all
        options:
          - all
          - backend
          - mobile
          - desktop

  # 上游变更检测：GitHub 不提供「第三方仓库 push 时通知我」的机制，
  # 只能由 GitHub 侧定期比对上游 main 的 SHA。SHA 未变则各 job 立即跳过。
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: vcp-deploy
  cancel-in-progress: false

jobs:
  # ============ 1. 服务端 ============
  backend:
    name: 构建并部署 VCPToolBox
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    if: |
      github.event_name == 'schedule'
      || inputs.targets == 'all'
      || inputs.targets == 'backend'

    env:
      CI_DIR: ${{ vars.VCP_CI_DIR }}

    steps:
      - name: 检测上游变更
        id: detect
        shell: bash
        run: |
          set -uo pipefail
          STATE="$CI_DIR/state.json"
          CURRENT=$(python3 -c "import json;print(json.load(open('$STATE'))['sha'])" 2>/dev/null || echo "")
          INPUT_SHA="${{ inputs.sha }}"

          if [ -n "$INPUT_SHA" ]; then
            TARGET="$INPUT_SHA"
          else
            TARGET=$(git ls-remote https://github.com/lioensky/VCPToolBox.git refs/heads/main | cut -f1)
          fi

          if [ -z "$TARGET" ]; then
            echo "::error::无法获取上游提交 SHA"
            exit 1
          fi

          echo "当前部署: ${CURRENT:-<无>}"
          echo "目标提交: $TARGET"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$TARGET" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "已是最新版本，跳过构建"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到变更，开始构建"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并部署
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          bash "$CI_DIR/build.sh" "${{ steps.detect.outputs.sha }}"

      - name: 汇总
        if: always()
        shell: bash
        run: |
          STATE="$CI_DIR/state.json"
          echo "### 服务端部署状态" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$STATE" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$STATE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============ 2. 移动端 APK ============
  mobile:
    name: 交叉编译 VCPMobile APK
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    if: |
      github.event_name == 'schedule'
      || inputs.targets == 'all'
      || inputs.targets == 'mobile'

    env:
      MOBILE_DIR: ${{ vars.VCP_MOBILE_DIR }}
      APK_URL: ${{ vars.VCP_APK_URL }}

    steps:
      - name: 检测 VCPMobile 变更
        id: detect
        shell: bash
        run: |
          set -uo pipefail
          STATE="$MOBILE_DIR/state.json"
          CURRENT=$(python3 -c "import json;print(json.load(open('$STATE'))['sha'])" 2>/dev/null || echo "")
          INPUT_SHA="${{ inputs.sha }}"

          if [ -n "$INPUT_SHA" ]; then
            TARGET="$INPUT_SHA"
          else
            TARGET=$(git ls-remote https://github.com/MRiecy/VCPMobile.git refs/heads/main | cut -f1)
          fi

          if [ -z "$TARGET" ]; then
            echo "::error::无法获取 VCPMobile 上游 SHA"
            exit 1
          fi

          echo "当前 APK: ${CURRENT:-<无>}"
          echo "目标提交: $TARGET"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$TARGET" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "APK 已是最新，跳过"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步上游源码
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$MOBILE_DIR/src"
          TARGET="${{ steps.detect.outputs.sha }}"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 https://github.com/MRiecy/VCPMobile.git "$SRC"
          fi
          cd "$SRC"
          git fetch --depth 1 origin "$TARGET"
          git checkout -f "$TARGET"

      - name: 构建 APK
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          bash "$MOBILE_DIR/build-apk.sh"

      - name: 汇总
        if: always()
        shell: bash
        run: |
          echo "### 移动端 APK" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MOBILE_DIR/state.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$MOBILE_DIR/state.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载地址: $APK_URL" >> "$GITHUB_STEP_SUMMARY"

  # ============ 3. 桌面端（仅本机在线时执行）============
  desktop:
    name: 构建 VCPChat Windows 客户端
    # 只投递给带 local 标签的 runner，本机不在线时排队等待，不会误派到服务端机器
    runs-on: [self-hosted, local, windows]
    timeout-minutes: 120
    if: |
      github.event_name == 'schedule'
      || inputs.targets == 'all'
      || inputs.targets == 'desktop'

    env:
      CHAT_DIR: ${{ vars.VCP_CHAT_DIR }}
      CHAT_SCRIPT: ${{ vars.VCP_CHAT_SCRIPT }}

    steps:
      - name: 检测 VCPChat 变更
        id: detect
        shell: pwsh
        run: |
          $stateFile = Join-Path $env:CHAT_DIR "state.json"
          $current = ""
          if (Test-Path $stateFile) {
            try { $current = (Get-Content $stateFile -Raw | ConvertFrom-Json).sha } catch {}
          }
          $inputSha = "${{ inputs.sha }}"
          if ($inputSha) {
            $target = $inputSha
          } else {
            $target = (git ls-remote https://github.com/lioensky/VCPChat.git refs/heads/main | ForEach-Object { ($_ -split "`t")[0] })
          }
          if (-not $target) { throw "无法获取 VCPChat 上游 SHA" }

          Write-Host "当前: $current"
          Write-Host "目标: $target"
          "sha=$target" >> $env:GITHUB_OUTPUT

          if ($current -eq $target -and "${{ inputs.force }}" -ne "true") {
            "run=false" >> $env:GITHUB_OUTPUT
            Write-Host "已是最新，跳过"
          } else {
            "run=true" >> $env:GITHUB_OUTPUT
          }

      - name: 构建客户端
        if: steps.detect.outputs.run == 'true'
        shell: pwsh
        run: |
          & $env:CHAT_SCRIPT -Sha "${{ steps.detect.outputs.sha }}"

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          "### 桌面客户端" >> $env:GITHUB_STEP_SUMMARY
          $stateFile = Join-Path $env:CHAT_DIR "state.json"
          if (Test-Path $stateFile) {
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content $stateFile >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
