name: VCP 部署对齐

# runner 上线后检查线上版本是否落后于最新发布，落后就自动补齐。
#
# 为什么独立成一个 workflow：
#   构建流水线只在有更新时才跑，而「runner 关机几天再开机」这种情况
#   需要在开机后主动对齐一次。两者触发条件不同，分开更清晰。
#
# 触发方式：
#   - runner 每次上线都会自动领取排队任务，这里用短间隔定时扫
#   - 也可以手动触发
#
# 幂等：目标版本已在跑就直接退出，不会无谓重启服务。

on:
  schedule:
    # 每 30 分钟检查一次。runner 不在线时任务会排队，
    # 上线后自动执行，等价于「上线就查询」。
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcp-deploy-sync
  cancel-in-progress: false

jobs:
  # 先问一句：最新发布是什么，值不值得部署
  check:
    name: 检查线上版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      backend_sha: ${{ steps.latest.outputs.backend_sha }}
      has_backend: ${{ steps.latest.outputs.has_backend }}
      has_desktop: ${{ steps.latest.outputs.has_desktop }}

    steps:
      - name: 查询最新发布
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")

          if [ -z "$TAG" ]; then
            echo "没有任何发布，无需对齐"
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            echo "has_desktop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "最新发布: $TAG"

          # 从发布资产名反推服务端提交
          ASSETS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('\n'.join(a['name'] for a in d.get('assets',[])))" \
            2>/dev/null || echo "")

          BACKEND_SHA=""
          HAS_BACKEND=false
          HAS_DESKTOP=false

          while IFS= read -r name; do
            case "$name" in
              vcptoolbox-*-linux-amd64.tar.gz)
                # vcptoolbox-20261025-add5dbb5-linux-amd64.tar.gz
                BACKEND_SHA=$(echo "$name" | sed -E 's/^vcptoolbox-[0-9]+-([0-9a-f]+)-linux-amd64\.tar\.gz$/\1/')
                HAS_BACKEND=true
                ;;
              *Setup*.exe) HAS_DESKTOP=true ;;
            esac
          done <<< "$ASSETS"

          echo "backend_sha=$BACKEND_SHA" >> "$GITHUB_OUTPUT"
          echo "has_backend=$HAS_BACKEND" >> "$GITHUB_OUTPUT"
          echo "has_desktop=$HAS_DESKTOP" >> "$GITHUB_OUTPUT"
          echo "服务端提交: ${BACKEND_SHA:-无}"
          echo "桌面端成品: $HAS_DESKTOP"

  sync-server:
    name: 对齐服务端
    needs: check
    if: needs.check.outputs.has_backend == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          path: ci

      - name: 更新服务
        shell: bash
        env:
          DEPLOY_DIR: ${{ vars.VCP_SERVER_DIR }}
          TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vcptoolbox:${{ needs.check.outputs.backend_sha }}
          TARGET_SHA: ${{ needs.check.outputs.backend_sha }}
          HEALTH_URL: ${{ vars.VCP_SERVER_URL }}
        run: |
          if [ -z "${DEPLOY_DIR:-}" ]; then
            echo "未配置仓库变量 VCP_SERVER_DIR，跳过"
            exit 0
          fi
          chmod +x ci/deploy/update-server.sh
          bash ci/deploy/update-server.sh

  sync-chat:
    name: 对齐桌面端
    needs: check
    if: needs.check.outputs.has_desktop == 'true'
    runs-on: [self-hosted, windows, local]
    timeout-minutes: 20

    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          path: ci

      - name: 更新客户端
        # 服务账户（NETWORK SERVICE）的 PATH 里没有 pwsh，只能用系统自带的 5.1。
        # 注意：5.1 按系统代码页读脚本，这个 run 块里只能写英文 —— 中文会乱码
        # 并破坏引号配对，报 TerminatorExpectedAtEndOfString。
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAT_DIR: ${{ vars.VCP_CHAT_DIR }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if (-not $env:CHAT_DIR) {
            Write-Host "VCP_CHAT_DIR not set, skip"
            exit 0
          }
          if (-not $env:TAG) {
            Write-Host "no release tag, skip"
            exit 0
          }
          & .\ci\deploy\update-chat.ps1 -Tag $env:TAG -DeployDir $env:CHAT_DIR -Repo $env:REPO
          exit $LASTEXITCODE
