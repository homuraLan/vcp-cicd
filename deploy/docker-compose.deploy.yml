# Rendered by prepare-server-compose.py; code/dependencies stay inside the image.
# !override requires Compose 2.24.4+; !reset would discard these mounts.
services:
  app:
    image: __IMAGE__
    environment:
      TDB_KNOWLEDGE_ROOT_PATH: __KNOWLEDGE_TARGET__
      TDB_KNOWLEDGE_STORE_PATH: __TDB_STORE_TARGET__
    volumes: !override
      - ./config.env:/usr/src/app/config.env
      - ./TVStxt:/usr/src/app/TVStxt
      - ./ToolConfigs:/usr/src/app/ToolConfigs
      - ./Plugin/UserAuth:/usr/src/app/Plugin/UserAuth
      - vcp_vectorstore:/usr/src/app/VectorStore
      - ./dailynote:/usr/src/app/dailynote
      - ./Plugin/VCPLog/log:/usr/src/app/Plugin/VCPLog/log
      - type: bind
        source: __KNOWLEDGE_SOURCE__
        target: __KNOWLEDGE_TARGET__
        bind:
          create_host_path: false
      - type: bind
        source: __TDB_STORE_SOURCE__
        target: __TDB_STORE_TARGET__
        bind:
          create_host_path: false
      - type: bind
        source: __RAG_PARAMS_SOURCE__
        target: /usr/src/app/rag_params.json
        bind:
          create_host_path: false
